[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-pipeline"
version = "0.1.0"
description = "Semantic Search & RAG Document Indexing Pipeline: chunking, Sentence-Transformers embeddings, FAISS cosine-similarity retrieval, and local Ollama generation."
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers==3.3.1",
    "faiss-cpu==1.9.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "requests==2.32.3",
    "numpy<2",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
